<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📸 MTG Scanner + Coleção</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
        }
        .container {
            max-width: 780px;
            width: 100%;
            background: #161b22;
            border-radius: 28px;
            padding: 20px;
            border: 1px solid #30363d;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            margin: 10px 0;
        }

        /* Cabeçalho */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 small {
            font-size: 0.7rem;
            color: #8b949e;
            font-weight: 400;
        }
        .badge-api {
            background: #1f3a2a;
            color: #7ee0a0;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            border: 1px solid #2ea04355;
        }

        /* Abas */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: #0d1117;
            border-radius: 60px;
            padding: 4px;
            border: 1px solid #21262d;
        }
        .tabs button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 40px;
            background: transparent;
            color: #8b949e;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .tabs button:hover {
            color: #e6edf3;
        }
        .tabs button.active {
            background: #f0883e;
            color: #0d1117;
            font-weight: 600;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Câmera */
        .camera-wrapper {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #30363d;
            margin-bottom: 16px;
        }
        video {
            display: block;
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            background: #000;
        }
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .scan-overlay .box {
            border: 2px dashed rgba(240, 136, 62, 0.6);
            border-radius: 16px;
            width: 75%;
            height: 55%;
            position: relative;
        }
        .scan-overlay .box::after {
            content: '⬆️ Enquadre o NOME da carta';
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #f0e6d0;
            white-space: nowrap;
            border: 1px solid #f0883e55;
        }

        /* Controles da câmera */
        .cam-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            align-items: center;
        }
        .cam-controls button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 0 auto;
        }
        .cam-controls button:hover {
            background: #30363d;
            border-color: #58a6ff;
        }
        .cam-controls button.primary {
            background: #f0883e;
            border-color: #f0883e;
            color: #0d1117;
            font-weight: 600;
            flex: 2;
        }
        .cam-controls button.primary:hover {
            background: #d97a2e;
        }
        .cam-controls button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        #fileInput {
            display: none;
        }

        /* Status */
        .status {
            background: #0d1117;
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 0.9rem;
            border: 1px solid #21262d;
            margin-bottom: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .status .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid #30363d;
            border-top-color: #f0883e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        .status .spinner.active {
            display: inline-block;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Área de correção manual (scanner) */
        .manual-area {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            background: #0d1117;
            padding: 6px 6px 6px 16px;
            border-radius: 60px;
            border: 1px solid #21262d;
            align-items: center;
        }
        .manual-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e6edf3;
            font-size: 0.95rem;
            padding: 8px 0;
            outline: none;
            min-width: 120px;
        }
        .manual-area input::placeholder {
            color: #484f58;
        }
        .manual-area button {
            background: #238636;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .manual-area button:hover {
            background: #2ea043;
        }

        /* Resultado da carta escaneada */
        .result {
            background: #0d1117;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid #21262d;
            display: none;
            margin-top: 4px;
            margin-bottom: 16px;
        }
        .result.visible {
            display: block;
        }
        .result .card-name {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .result .card-set {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .result .card-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            font-size: 0.9rem;
            color: #c9d1d9;
            margin-bottom: 8px;
        }
        .result .card-detail span {
            background: #161b22;
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid #21262d;
        }
        .result .card-text {
            background: #161b22;
            border-left: 3px solid #f0883e;
            padding: 10px 14px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-break: break-word;
            font-style: italic;
        }
        .result .card-image {
            margin-top: 10px;
            max-width: 100%;
            max-height: 180px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        .result .add-collection-btn {
            margin-top: 12px;
            background: #f0883e;
            border: none;
            color: #0d1117;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .result .add-collection-btn:hover {
            background: #d97a2e;
        }

        /* Coleção - Filtros */
        .collection-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            background: #0d1117;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #21262d;
            align-items: center;
        }
        .collection-filters input,
        .collection-filters select {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 40px;
            padding: 8px 16px;
            color: #e6edf3;
            font-size: 0.9rem;
            outline: none;
            flex: 1;
            min-width: 120px;
        }
        .collection-filters input:focus,
        .collection-filters select:focus {
            border-color: #f0883e;
            box-shadow: 0 0 0 3px #f0883e33;
        }
        .collection-filters select {
            flex: 0.5;
            cursor: pointer;
        }
        .collection-filters .filter-label {
            color: #8b949e;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Lista da coleção */
        .collection-list {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .collection-list::-webkit-scrollbar {
            width: 6px;
        }
        .collection-list::-webkit-scrollbar-track {
            background: #0d1117;
            border-radius: 10px;
        }
        .collection-list::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }

        .collection-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d1117;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid #21262d;
            gap: 12px;
            flex-wrap: wrap;
        }
        .collection-item .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 150px;
        }
        .collection-item .info img {
            width: 32px;
            height: 44px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #30363d;
            background: #000;
        }
        .collection-item .info .name {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .collection-item .info .set {
            font-size: 0.7rem;
            color: #8b949e;
        }
        .collection-item .remove-btn {
            background: transparent;
            border: none;
            color: #f85149;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .collection-item .remove-btn:hover {
            background: #2d1a1a;
        }
        .collection-empty {
            color: #484f58;
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
        }
        .collection-count {
            color: #8b949e;
            font-size: 0.8rem;
            margin-left: 8px;
        }
        .collection-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .collection-actions button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .collection-actions button:hover {
            background: #30363d;
            border-color: #f0883e;
        }
        .collection-actions button.danger {
            border-color: #da3633;
            color: #f85149;
        }
        .collection-actions button.danger:hover {
            background: #2d1a1a;
            border-color: #f85149;
        }

        .footnote {
            margin-top: 14px;
            font-size: 0.7rem;
            color: #484f58;
            text-align: center;
            border-top: 1px solid #21262d;
            padding-top: 14px;
        }
        .footnote a {
            color: #58a6ff;
            text-decoration: none;
        }
        .footnote a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .container {
                padding: 12px;
            }
            .cam-controls button {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .manual-area input {
                font-size: 0.85rem;
            }
            .collection-filters input,
            .collection-filters select {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
            .collection-item .info .name {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>📸 MTG <small>Scanner + Coleção</small></h1>
            <span class="badge-api">OCR.space</span>
        </div>

        <!-- Abas -->
        <div class="tabs" id="tabContainer">
            <button class="active" data-tab="tabScanner">🔍 Scanner</button>
            <button data-tab="tabColecao">📚 Coleção</button>
        </div>

        <!-- ========== ABA SCANNER ========== -->
        <div id="tabScanner" class="tab-content active">
            <!-- Câmera -->
            <div class="camera-wrapper">
                <video id="video" autoplay playsinline></video>
                <div class="scan-overlay">
                    <div class="box"></div>
                </div>
            </div>

            <!-- Controles -->
            <div class="cam-controls">
                <button id="startCam">📷 Iniciar</button>
                <button id="stopCam" disabled>⏹ Parar</button>
                <button id="scanBtn" class="primary" disabled>📸 Escanear</button>
                <label for="fileInput" style="flex:0.5;text-align:center;background:#21262d;padding:10px 0;border-radius:60px;border:1px solid #30363d;cursor:pointer;">📁</label>
                <input type="file" id="fileInput" accept="image/*" />
            </div>

            <!-- Status -->
            <div class="status" id="status">
                <span class="spinner" id="spinner"></span>
                <span id="statusText">🔌 Clique em "Iniciar" para ativar a câmera</span>
            </div>

            <!-- Busca manual -->
            <div class="manual-area">
                <input type="text" id="cardName" placeholder="✏️ Corrija o nome aqui ou digite manualmente" />
                <button id="searchManual">Buscar</button>
            </div>

            <!-- Resultado -->
            <div class="result" id="result">
                <div class="card-name" id="cardNameDisplay">—</div>
                <div class="card-set" id="cardSetDisplay">—</div>
                <div class="card-detail" id="cardDetails"></div>
                <div class="card-text" id="cardText"></div>
                <img class="card-image" id="cardImage" alt="Imagem da carta" />
                <button class="add-collection-btn" id="addToCollectionBtn">➕ Adicionar à coleção</button>
            </div>
        </div>

        <!-- ========== ABA COLEÇÃO ========== -->
        <div id="tabColecao" class="tab-content">
            <!-- Filtros -->
            <div class="collection-filters">
                <span class="filter-label">🔍 Filtros:</span>
                <input type="text" id="filterName" placeholder="Buscar por nome..." />
                <select id="filterRarity">
                    <option value="">Todas as raridades</option>
                </select>
            </div>

            <!-- Lista -->
            <div class="collection-list" id="collectionList">
                <div class="collection-empty">Nenhuma carta na coleção ainda.</div>
            </div>

            <!-- Ações -->
            <div class="collection-actions">
                <span style="flex:1;color:#8b949e;font-size:0.85rem;" id="collectionCount">0 cartas</span>
                <button id="exportCollectionBtn">📤 Exportar JSON</button>
                <button id="clearCollectionBtn" class="danger">🗑️ Limpar tudo</button>
            </div>
        </div>

        <div class="footnote">
            Dados da <a href="https://scryfall.com" target="_blank">Scryfall</a> &bull; OCR via <a href="https://ocr.space" target="_blank">OCR.space</a> &bull; Coleção salva localmente
        </div>
    </div>

    <script>
        // ================================================================
        //  APP COMPLETO – SCANNER + COLEÇÃO COM FILTROS
        // ================================================================

        // ---- Elementos ----
        // Scanner
        const video = document.getElementById('video');
        const startCam = document.getElementById('startCam');
        const stopCam = document.getElementById('stopCam');
        const scanBtn = document.getElementById('scanBtn');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const resultDiv = document.getElementById('result');
        const cardNameDisplay = document.getElementById('cardNameDisplay');
        const cardSetDisplay = document.getElementById('cardSetDisplay');
        const cardDetails = document.getElementById('cardDetails');
        const cardText = document.getElementById('cardText');
        const cardImage = document.getElementById('cardImage');
        const nameInput = document.getElementById('cardName');
        const searchManualBtn = document.getElementById('searchManual');
        const addToCollectionBtn = document.getElementById('addToCollectionBtn');

        // Coleção
        const collectionList = document.getElementById('collectionList');
        const collectionCount = document.getElementById('collectionCount');
        const filterName = document.getElementById('filterName');
        const filterRarity = document.getElementById('filterRarity');
        const clearCollectionBtn = document.getElementById('clearCollectionBtn');
        const exportCollectionBtn = document.getElementById('exportCollectionBtn');

        // Abas
        const tabButtons = document.querySelectorAll('.tabs button');
        const tabContents = {
            tabScanner: document.getElementById('tabScanner'),
            tabColecao: document.getElementById('tabColecao')
        };

        let stream = null;
        let isProcessing = false;
        let lastScannedCard = null;
        let collection = [];

        // ---- Gerenciamento de abas ----
        tabButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const tabId = this.dataset.tab;
                // Atualiza botões
                tabButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                // Atualiza conteúdos
                Object.keys(tabContents).forEach(key => {
                    tabContents[key].classList.toggle('active', key === tabId);
                });
                // Se for a aba de coleção, renderiza com filtros atuais
                if (tabId === 'tabColecao') {
                    renderCollection();
                }
            });
        });

        // ---- Coleção ----
        function loadCollection() {
            try {
                const saved = localStorage.getItem('mtg_collection');
                collection = saved ? JSON.parse(saved) : [];
            } catch (e) { collection = []; }
            // Atualiza dropdown de raridades
            updateRarityFilter();
            renderCollection();
        }

        function saveCollection() {
            localStorage.setItem('mtg_collection', JSON.stringify(collection));
            updateRarityFilter();
            renderCollection();
        }

        function addCardToCollection(card) {
            if (!card) return;
            // Evita duplicatas exatas? Pode permitir repetição, mas vamos verificar se já existe (opcional)
            // Para simplificar, sempre adiciona.
            const entry = {
                id: Date.now(),
                name: card.name,
                set_name: card.set_name || 'Desconhecido',
                collector_number: card.collector_number || '—',
                rarity: card.rarity || 'comum',
                type_line: card.type_line || '—',
                mana_cost: card.mana_cost || '—',
                image_uri: card.image_uris?.normal || card.card_faces?.[0]?.image_uris?.normal || null,
                oracle_text: card.oracle_text || '',
                added_at: new Date().toISOString()
            };
            collection.push(entry);
            saveCollection();
            setStatus(`✅ "${card.name}" adicionado à coleção!`);
        }

        function removeCardFromCollection(id) {
            collection = collection.filter(c => c.id !== id);
            saveCollection();
        }

        function clearCollection() {
            if (collection.length === 0) return;
            if (confirm('Tem certeza que deseja remover todas as cartas?')) {
                collection = [];
                saveCollection();
                setStatus('🗑️ Coleção limpa.');
            }
        }

        function exportCollection() {
            if (collection.length === 0) {
                setStatus('⚠️ Coleção vazia.');
                return;
            }
            const dataStr = JSON.stringify(collection, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mtg_collection_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            setStatus('📤 Coleção exportada!');
        }

        // Atualiza o dropdown de raridades com base na coleção atual
        function updateRarityFilter() {
            const rarities = new Set();
            collection.forEach(c => { if (c.rarity) rarities.add(c.rarity); });
            const currentValue = filterRarity.value;
            filterRarity.innerHTML = '<option value="">Todas as raridades</option>';
            // Ordena: common, uncommon, rare, mythic, special, etc.
            const order = { common: 1, uncommon: 2, rare: 3, mythic: 4, special: 5, bonus: 6 };
            const sorted = Array.from(rarities).sort((a, b) => (order[a] || 99) - (order[b] || 99));
            sorted.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = r.charAt(0).toUpperCase() + r.slice(1);
                filterRarity.appendChild(opt);
            });
            filterRarity.value = currentValue;
        }

        // Renderiza a coleção com filtros
        function renderCollection() {
            const nameFilter = filterName.value.toLowerCase().trim();
            const rarityFilter = filterRarity.value;

            let filtered = collection;
            if (nameFilter) {
                filtered = filtered.filter(c => c.name.toLowerCase().includes(nameFilter));
            }
            if (rarityFilter) {
                filtered = filtered.filter(c => c.rarity === rarityFilter);
            }

            collectionCount.textContent = `${filtered.length} cartas (total: ${collection.length})`;

            if (filtered.length === 0) {
                collectionList.innerHTML = `<div class="collection-empty">Nenhuma carta encontrada com os filtros atuais.</div>`;
                return;
            }

            // Ordena: mais recentes primeiro
            const sorted = [...filtered].reverse();
            let html = '';
            for (const item of sorted) {
                const imgHtml = item.image_uri ?
                    `<img src="${item.image_uri}" alt="${item.name}" loading="lazy" />` :
                    `<div style="width:32px;height:44px;background:#161b22;border-radius:4px;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:0.6rem;color:#484f58;">?</div>`;
                html += `
                    <div class="collection-item">
                        <div class="info">
                            ${imgHtml}
                            <div>
                                <div class="name">${item.name}</div>
                                <div class="set">${item.set_name} #${item.collector_number} • ${item.rarity}</div>
                            </div>
                        </div>
                        <button class="remove-btn" data-id="${item.id}">✕</button>
                    </div>
                `;
            }
            collectionList.innerHTML = html;

            // Eventos de remoção
            document.querySelectorAll('.collection-item .remove-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = Number(this.dataset.id);
                    removeCardFromCollection(id);
                });
            });
        }

        // ---- Scanner ----
        function setStatus(msg, loading = false) {
            statusText.textContent = msg;
            spinner.classList.toggle('active', loading);
        }

        async function startCamera() {
            try {
                setStatus('📷 Solicitando câmera...', true);
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 } }
                });
                video.srcObject = stream;
                await video.play();
                startCam.disabled = true;
                stopCam.disabled = false;
                scanBtn.disabled = false;
                setStatus('📷 Câmera ativa – enquadre o topo da carta');
            } catch (err) {
                setStatus('❌ Erro: ' + err.message);
                console.error(err);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            startCam.disabled = false;
            stopCam.disabled = true;
            scanBtn.disabled = true;
            setStatus('Câmera desligada');
        }

        function captureFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas;
        }

        function cropAndPreprocess(canvas) {
            const w = canvas.width;
            const h = canvas.height;
            const cropX = w * 0.20;
            const cropY = h * 0.04;
            const cropW = w * 0.60;
            const cropH = h * 0.22;

            const cropped = document.createElement('canvas');
            cropped.width = cropW;
            cropped.height = cropH;
            const ctx = cropped.getContext('2d');
            ctx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            const imageData = ctx.getImageData(0, 0, cropW, cropH);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                const val = gray > 128 ? 255 : 0;
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
            }
            ctx.putImageData(imageData, 0, 0);
            return cropped;
        }

        async function ocrOnline(canvas) {
            const base64 = canvas.toDataURL('image/png').split(',')[1];
            const formData = new FormData();
            formData.append('base64Image', `data:image/png;base64,${base64}`);
            formData.append('apikey', 'K80807337088957');
            formData.append('language', 'eng');
            formData.append('scale', 'true');
            formData.append('OCREngine', '2');
            formData.append('isTable', 'false');
            formData.append('detectOrientation', 'true');

            const response = await fetch('https://api.ocr.space/parse/image', {
                method: 'POST',
                body: formData
            });
            if (!response.ok) throw new Error(`OCR.space erro ${response.status}`);
            const data = await response.json();
            if (data.IsErroredOnProcessing) throw new Error(data.ErrorMessage || 'Erro no OCR');
            const parsedText = data.ParsedResults.map(r => r.ParsedText).join(' ');
            return parsedText.trim();
        }

        function extractCardName(ocrText) {
            if (!ocrText) return null;
            const lines = ocrText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            for (const line of lines) {
                const words = line.split(/\s+/).length;
                if (words <= 6 && words >= 1) {
                    const clean = line.replace(/[^a-zA-Z0-9\s'\-]/g, '');
                    if (clean.length >= 2) return clean;
                }
            }
            return lines[0] || null;
        }

        async function searchCard(name) {
            if (!name || name.trim().length < 2) return null;
            const trimmed = name.trim();
            const url =
                `https://api.scryfall.com/cards/search?q=!"${encodeURIComponent(trimmed)}"&unique=cards`;
            const resp = await fetch(url);
            if (!resp.ok) {
                if (resp.status === 404) return null;
                throw new Error(`Scryfall erro ${resp.status}`);
            }
            const data = await resp.json();
            return data.data && data.data.length > 0 ? data.data[0] : null;
        }

        function showResult(card, searchedName) {
            resultDiv.classList.add('visible');
            if (!card) {
                cardNameDisplay.textContent = '❌ Carta não encontrada';
                cardSetDisplay.textContent = `"${searchedName || '—'}"`;
                cardDetails.innerHTML = '';
                cardText.textContent = '';
                cardText.style.display = 'none';
                cardImage.style.display = 'none';
                addToCollectionBtn.style.display = 'none';
                lastScannedCard = null;
                return;
            }
            lastScannedCard = card;
            cardNameDisplay.textContent = card.name || 'Sem nome';
            cardSetDisplay.textContent = `${card.set_name || '?'}  •  #${card.collector_number || '?'}`;

            const parts = [];
            if (card.rarity) parts.push(`⭐ ${card.rarity.charAt(0).toUpperCase() + card.rarity.slice(1)}`);
            if (card.mana_cost) parts.push(`💧 ${card.mana_cost}`);
            if (card.type_line) parts.push(`📜 ${card.type_line}`);
            if (card.power && card.toughness) parts.push(`⚔️ ${card.power}/${card.toughness}`);
            if (card.cmc !== undefined) parts.push(`🔢 CMC: ${card.cmc}`);
            cardDetails.innerHTML = parts.map(p => `<span>${p}</span>`).join('');

            // Texto da carta (efeito)
            const oracle = card.oracle_text || '';
            if (oracle) {
                cardText.textContent = oracle;
                cardText.style.display = 'block';
            } else {
                cardText.textContent = '';
                cardText.style.display = 'none';
            }

            if (card.image_uris?.normal) {
                cardImage.src = card.image_uris.normal;
                cardImage.style.display = 'block';
            } else if (card.card_faces?.[0]?.image_uris?.normal) {
                cardImage.src = card.card_faces[0].image_uris.normal;
                cardImage.style.display = 'block';
            } else {
                cardImage.style.display = 'none';
            }
            addToCollectionBtn.style.display = 'inline-block';
        }

        // ---- Fluxo escanear ----
        async function scanCard() {
            if (isProcessing) return;
            if (!video.srcObject) {
                setStatus('⚠️ Ligue a câmera primeiro.');
                return;
            }

            isProcessing = true;
            scanBtn.disabled = true;
            setStatus('📸 Capturando imagem...', true);

            try {
                const fullCanvas = captureFrame();
                const processedCanvas = cropAndPreprocess(fullCanvas);

                setStatus('🔎 Enviando para OCR.space...', true);
                const ocrText = await ocrOnline(processedCanvas);
                console.log('OCR bruto:', ocrText);

                const guessedName = extractCardName(ocrText);
                if (!guessedName) {
                    setStatus('❌ Não foi possível identificar o nome. Tente enquadrar melhor.');
                    showResult(null, '—');
                    nameInput.value = ocrText.substring(0, 60);
                    return;
                }

                nameInput.value = guessedName;
                setStatus(`🔍 Nome lido: "${guessedName}" — buscando...`, true);

                const card = await searchCard(guessedName);
                if (card) {
                    setStatus(`✅ Encontrado: ${card.name}`);
                    showResult(card, guessedName);
                } else {
                    setStatus(`⚠️ Nenhuma carta com "${guessedName}" — tente corrigir o nome acima.`);
                    showResult(null, guessedName);
                }

            } catch (err) {
                setStatus('❌ Erro: ' + err.message);
                console.error(err);
            } finally {
                isProcessing = false;
                scanBtn.disabled = false;
            }
        }

        // ---- Busca manual ----
        async function manualSearch() {
            const name = nameInput.value.trim();
            if (!name) {
                setStatus('⚠️ Digite um nome.');
                return;
            }
            setStatus(`🔍 Buscando "${name}"...`, true);
            try {
                const card = await searchCard(name);
                if (card) {
                    setStatus(`✅ Encontrado: ${card.name}`);
                    showResult(card, name);
                } else {
                    setStatus(`❌ Nenhuma carta com "${name}"`);
                    showResult(null, name);
                }
            } catch (err) {
                setStatus('❌ Erro: ' + err.message);
                console.error(err);
            }
        }

        // ---- Upload de imagem ----
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            setStatus('📂 Processando imagem...', true);
            try {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const processed = cropAndPreprocess(canvas);
                    setStatus('🔎 Enviando para OCR.space...', true);
                    const ocrText = await ocrOnline(processed);
                    const guessed = extractCardName(ocrText);
                    if (guessed) {
                        nameInput.value = guessed;
                        setStatus(`📝 Nome lido: "${guessed}" — buscando...`, true);
                        const card = await searchCard(guessed);
                        if (card) {
                            setStatus(`✅ ${card.name}`);
                            showResult(card, guessed);
                        } else {
                            setStatus(`⚠️ Nenhuma carta com "${guessed}"`);
                            showResult(null, guessed);
                        }
                    } else {
                        setStatus('❌ Não foi possível ler o nome na imagem.');
                        nameInput.value = ocrText.substring(0, 60);
                        showResult(null, '—');
                    }
                };
                img.src = URL.createObjectURL(file);
            } catch (err) {
                setStatus('❌ Erro: ' + err.message);
            }
            fileInput.value = '';
        }

        // ---- Adicionar à coleção (botão) ----
        function handleAddToCollection() {
            if (lastScannedCard) {
                addCardToCollection(lastScannedCard);
            } else {
                setStatus('⚠️ Nenhuma carta escaneada.');
            }
        }

        // ---- Event listeners ----
        startCam.addEventListener('click', startCamera);
        stopCam.addEventListener('click', stopCamera);
        scanBtn.addEventListener('click', scanCard);
        fileInput.addEventListener('change', handleFileUpload);
        searchManualBtn.addEventListener('click', manualSearch);
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') manualSearch();
        });
        addToCollectionBtn.addEventListener('click', handleAddToCollection);
        clearCollectionBtn.addEventListener('click', clearCollection);
        exportCollectionBtn.addEventListener('click', exportCollection);
        filterName.addEventListener('input', renderCollection);
        filterRarity.addEventListener('change', renderCollection);

        // ---- Inicialização ----
        loadCollection();
        setStatus('📷 Clique em "Iniciar" para ativar a câmera');
        resultDiv.classList.remove('visible');
        addToCollectionBtn.style.display = 'none';

        // Se a aba de coleção for a primeira ativa, já renderiza
        // (já foi carregada)
    </script>
</body>
</html>
