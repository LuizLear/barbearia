<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanner MTG - Número do Colecionador</title>

    <!-- CDN do Tesseract.js para OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #161b22;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid #30363d;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 small {
            font-size: 0.8rem;
            font-weight: 400;
            color: #8b949e;
        }
        .sub {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border-left: 3px solid #f0883e;
            padding-left: 12px;
        }
        .video-wrapper {
            position: relative;
            background: #0d1117;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #30363d;
            margin-bottom: 16px;
        }
        video {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #0d1117;
        }
        .frame-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #f0e6d0;
            border: 1px solid #f0883e66;
            pointer-events: none;
            white-space: nowrap;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .controls button,
        .controls label {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .controls button:hover {
            background: #30363d;
            border-color: #58a6ff;
        }
        .controls button.primary {
            background: #f0883e;
            border-color: #f0883e;
            color: #0d1117;
        }
        .controls button.primary:hover {
            background: #d97a2e;
            border-color: #d97a2e;
        }
        .controls button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        #fileInput {
            display: none;
        }
        .status {
            background: #0d1117;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.9rem;
            border: 1px solid #21262d;
            margin-bottom: 16px;
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #30363d;
            border-top-color: #f0883e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        .status .spinner.active {
            display: inline-block;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .result {
            background: #0d1117;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #21262d;
            margin-top: 8px;
            display: none;
        }
        .result.visible {
            display: block;
        }
        .result .card-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .result .card-set {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        .result .card-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            font-size: 0.9rem;
            color: #c9d1d9;
        }
        .result .card-detail span {
            background: #161b22;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #21262d;
        }
        .result .card-image {
            margin-top: 16px;
            max-width: 100%;
            max-height: 220px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        .result .not-found {
            color: #f0883e;
        }
        .badge {
            display: inline-block;
            background: #21262d;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #8b949e;
            margin-left: 8px;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #484f58;
            text-align: center;
            border-top: 1px solid #21262d;
            padding-top: 16px;
        }
        .footer a {
            color: #58a6ff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 500px) {
            .container {
                padding: 16px;
            }
            .controls button {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            🧙 Scanner MTG
            <small>por número do colecionador</small>
        </h1>
        <div class="sub">
            📷 Aponte a câmera para o <strong>canto inferior esquerdo</strong> da carta,
            onde fica o número do colecionador.
        </div>

        <!-- Vídeo / Câmera -->
        <div class="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <div class="frame-hint">⬇️ Enquadre o número do colecionador</div>
        </div>

        <!-- Controles -->
        <div class="controls">
            <button id="startCamera">📷 Iniciar câmera</button>
            <button id="stopCamera" disabled>⏹️ Parar</button>
            <button id="scanBtn" class="primary" disabled>🔍 Escanear</button>
            <label for="fileInput">📁 Enviar foto</label>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <!-- Status -->
        <div class="status" id="status">
            <span class="spinner" id="spinner"></span>
            <span id="statusText">Aguardando...</span>
        </div>

        <!-- Resultado -->
        <div class="result" id="result">
            <div class="card-name" id="cardName">—</div>
            <div class="card-set" id="cardSet">—</div>
            <div class="card-detail" id="cardDetails"></div>
            <img class="card-image" id="cardImage" alt="Imagem da carta" />
        </div>

        <div class="footer">
            Dados fornecidos por <a href="https://scryfall.com" target="_blank">Scryfall</a> •
            Projeto inspirado no <a href="https://github.com/GrimbiXcode/mtgscan" target="_blank">mtgscan</a>
        </div>
    </div>

    <script>
        // ============================================================
        //  SCANNER MTG — CÂMERA + OCR (Tesseract.js) + SCRYFALL API
        // ============================================================

        // ---- Elementos DOM ----
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startCamera');
        const stopBtn = document.getElementById('stopCamera');
        const scanBtn = document.getElementById('scanBtn');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const resultDiv = document.getElementById('result');
        const cardName = document.getElementById('cardName');
        const cardSet = document.getElementById('cardSet');
        const cardDetails = document.getElementById('cardDetails');
        const cardImage = document.getElementById('cardImage');

        let stream = null;
        let isScanning = false;

        // ---- Atualizar status ----
        function setStatus(msg, loading = false) {
            statusText.textContent = msg;
            spinner.classList.toggle('active', loading);
        }

        // ---- Câmera ----
        async function startCamera() {
            try {
                setStatus('Solicitando acesso à câmera...', true);
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 } }
                });
                video.srcObject = stream;
                await video.play();

                startBtn.disabled = true;
                stopBtn.disabled = false;
                scanBtn.disabled = false;
                setStatus('Câmera ativa — aponte para o número do colecionador');
            } catch (err) {
                setStatus('❌ Erro ao acessar câmera: ' + err.message);
                console.error(err);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            scanBtn.disabled = true;
            setStatus('Câmera desligada');
        }

        // ---- Capturar frame do vídeo ----
        function captureFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas;
        }

        // ---- Recortar a região do número do colecionador (canto inferior esquerdo) ----
        function cropCollectorArea(canvas) {
            const w = canvas.width;
            const h = canvas.height;
            // Pega ~30% da largura e ~25% da altura a partir do canto inferior esquerdo
            const cropX = 0;
            const cropY = h * 0.72;
            const cropW = w * 0.30;
            const cropH = h * 0.25;

            const cropped = document.createElement('canvas');
            cropped.width = cropW;
            cropped.height = cropH;
            const ctx = cropped.getContext('2d');
            ctx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            return cropped;
        }

        // ---- OCR com Tesseract.js ----
        async function ocrCollectorNumber(canvas) {
            // Converte o canvas para imagem (data URL)
            const imageData = canvas.toDataURL('image/png');

            // Configura o Tesseract para reconhecer apenas números (digits)
            const result = await Tesseract.recognize(imageData, 'eng', {
                tessedit_char_whitelist: '0123456789',
                tessedit_pageseg_mode: '7', // linha de texto única
            });

            const text = result.data.text.trim();
            // Remove tudo que não for número
            const cleaned = text.replace(/\D/g, '');
            return cleaned;
        }

        // ---- Buscar carta na Scryfall ----
        async function fetchCard(collectorNumber) {
            if (!collectorNumber || collectorNumber.length < 1) {
                return null;
            }
            // Busca pelo número do colecionador (em qualquer conjunto)
            // Ex: "number:123" — retorna todas as cartas com esse número
            const url =
                `https://api.scryfall.com/cards/search?q=number%3A${encodeURIComponent(collectorNumber)}&unique=prints`;

            const resp = await fetch(url);
            if (!resp.ok) {
                if (resp.status === 404) return null;
                throw new Error(`Scryfall erro ${resp.status}`);
            }
            const data = await resp.json();
            if (data.data && data.data.length > 0) {
                // Pega a primeira correspondência (mais recente)
                return data.data[0];
            }
            return null;
        }

        // ---- Exibir resultado ----
        function showResult(card, collectorNumber) {
            resultDiv.classList.add('visible');

            if (!card) {
                cardName.textContent = '❌ Carta não encontrada';
                cardSet.textContent = `Número: ${collectorNumber || '—'}`;
                cardDetails.innerHTML = '';
                cardImage.style.display = 'none';
                return;
            }

            cardName.textContent = card.name || 'Nome desconhecido';
            cardSet.textContent = `${card.set_name || 'Conjunto desconhecido'}  •  #${card.collector_number || '—'}`;

            // Detalhes
            const parts = [];
            if (card.rarity) parts.push(`⭐ ${card.rarity.charAt(0).toUpperCase() + card.rarity.slice(1)}`);
            if (card.mana_cost) parts.push(`💧 ${card.mana_cost}`);
            if (card.type_line) parts.push(`📜 ${card.type_line}`);
            if (card.power && card.toughness) parts.push(`⚔️ ${card.power}/${card.toughness}`);
            cardDetails.innerHTML = parts.map(p => `<span>${p}</span>`).join('');

            // Imagem
            if (card.image_uris && card.image_uris.normal) {
                cardImage.src = card.image_uris.normal;
                cardImage.style.display = 'block';
            } else if (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris) {
                cardImage.src = card.card_faces[0].image_uris.normal;
                cardImage.style.display = 'block';
            } else {
                cardImage.style.display = 'none';
            }
        }

        // ---- Fluxo principal de escaneamento ----
        async function scanCard() {
            if (isScanning) return;
            if (!video.srcObject) {
                setStatus('⚠️ Ligue a câmera primeiro');
                return;
            }

            isScanning = true;
            scanBtn.disabled = true;
            setStatus('📸 Capturando imagem...', true);

            try {
                // 1. Captura o frame
                const fullCanvas = captureFrame();

                // 2. Recorta a região do número do colecionador
                const croppedCanvas = cropCollectorArea(fullCanvas);

                // 3. OCR
                setStatus('🔎 Lendo o número com OCR...', true);
                const collectorNumber = await ocrCollectorNumber(croppedCanvas);

                if (!collectorNumber) {
                    setStatus('⚠️ Nenhum número identificado. Tente enquadrar melhor.');
                    showResult(null, '—');
                    return;
                }

                setStatus(`🔍 Número detectado: ${collectorNumber} — consultando Scryfall...`, true);

                // 4. Busca na Scryfall
                const card = await fetchCard(collectorNumber);

                if (card) {
                    setStatus(`✅ Carta encontrada: ${card.name} (${card.set_name})`);
                    showResult(card, collectorNumber);
                } else {
                    setStatus(`⚠️ Nenhuma carta encontrada com o número ${collectorNumber}`);
                    showResult(null, collectorNumber);
                }

            } catch (err) {
                setStatus('❌ Erro: ' + err.message);
                console.error(err);
            } finally {
                isScanning = false;
                scanBtn.disabled = false;
            }
        }

        // ---- Upload de imagem ----
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            try {
                setStatus('📂 Processando imagem...', true);
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    // Mesmo fluxo: recortar e OCR
                    const cropped = cropCollectorArea(canvas);
                    const num = await ocrCollectorNumber(cropped);
                    if (!num) {
                        setStatus('⚠️ Nenhum número identificado na imagem.');
                        showResult(null, '—');
                        return;
                    }
                    setStatus(`🔍 Número: ${num} — consultando Scryfall...`, true);
                    const card = await fetchCard(num);
                    if (card) {
                        setStatus(`✅ ${card.name}`);
                        showResult(card, num);
                    } else {
                        setStatus(`⚠️ Carta não encontrada (${num})`);
                        showResult(null, num);
                    }
                };
                img.src = URL.createObjectURL(file);
            } catch (err) {
                setStatus('❌ Erro ao processar imagem: ' + err.message);
            }
            // Limpa o input para permitir reenvio
            fileInput.value = '';
        }

        // ---- Event Listeners ----
        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopCamera);
        scanBtn.addEventListener('click', scanCard);
        fileInput.addEventListener('change', handleFileUpload);

        // ---- Inicialização ----
        setStatus('📷 Clique em "Iniciar câmera" para começar');
        resultDiv.classList.remove('visible');
    </script>
</body>
</html>
