<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📸 Scanner MTG – Câmera + OCR online</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #161b22;
            border-radius: 28px;
            padding: 20px;
            border: 1px solid #30363d;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
        }

        /* Título */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 small {
            font-size: 0.7rem;
            color: #8b949e;
            font-weight: 400;
        }
        .badge-api {
            background: #1f3a2a;
            color: #7ee0a0;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            border: 1px solid #2ea04355;
        }

        /* Câmera - DESTAQUE */
        .camera-wrapper {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #30363d;
            margin-bottom: 16px;
        }
        video {
            display: block;
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            background: #000;
        }
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .scan-overlay .box {
            border: 2px dashed rgba(240, 136, 62, 0.6);
            border-radius: 16px;
            width: 75%;
            height: 55%;
            position: relative;
        }
        .scan-overlay .box::after {
            content: '⬆️ Enquadre o NOME da carta';
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #f0e6d0;
            white-space: nowrap;
            border: 1px solid #f0883e55;
        }

        /* Controles da câmera */
        .cam-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            align-items: center;
        }
        .cam-controls button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 0 auto;
        }
        .cam-controls button:hover {
            background: #30363d;
            border-color: #58a6ff;
        }
        .cam-controls button.primary {
            background: #f0883e;
            border-color: #f0883e;
            color: #0d1117;
            font-weight: 600;
            flex: 2;
        }
        .cam-controls button.primary:hover {
            background: #d97a2e;
        }
        .cam-controls button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        #fileInput {
            display: none;
        }

        /* Status */
        .status {
            background: #0d1117;
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 0.9rem;
            border: 1px solid #21262d;
            margin-bottom: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .status .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid #30363d;
            border-top-color: #f0883e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        .status .spinner.active {
            display: inline-block;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Área de correção manual (plus) */
        .manual-area {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            background: #0d1117;
            padding: 6px 6px 6px 16px;
            border-radius: 60px;
            border: 1px solid #21262d;
            align-items: center;
        }
        .manual-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e6edf3;
            font-size: 0.95rem;
            padding: 8px 0;
            outline: none;
            min-width: 120px;
        }
        .manual-area input::placeholder {
            color: #484f58;
        }
        .manual-area button {
            background: #238636;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .manual-area button:hover {
            background: #2ea043;
        }

        /* Resultado */
        .result {
            background: #0d1117;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid #21262d;
            display: none;
            margin-top: 4px;
        }
        .result.visible {
            display: block;
        }
        .result .card-name {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .result .card-set {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .result .card-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            font-size: 0.9rem;
            color: #c9d1d9;
        }
        .result .card-detail span {
            background: #161b22;
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid #21262d;
        }
        .result .card-image {
            margin-top: 14px;
            max-width: 100%;
            max-height: 220px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        .footnote {
            margin-top: 14px;
            font-size: 0.7rem;
            color: #484f58;
            text-align: center;
            border-top: 1px solid #21262d;
            padding-top: 14px;
        }
        .footnote a {
            color: #58a6ff;
            text-decoration: none;
        }
        .footnote a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>📸 MTG <small>Scanner</small></h1>
            <span class="badge-api">OCR.space</span>
        </div>

        <!-- Câmera (principal) -->
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline></video>
            <div class="scan-overlay">
                <div class="box"></div>
            </div>
        </div>

        <!-- Controles da câmera -->
        <div class="cam-controls">
            <button id="startCam">📷 Iniciar</button>
            <button id="stopCam" disabled>⏹ Parar</button>
            <button id="scanBtn" class="primary" disabled>📸 Escanear</button>
            <label for="fileInput" style="flex:0.5;text-align:center;background:#21262d;padding:10px 0;border-radius:60px;border:1px solid #30363d;cursor:pointer;">📁</label>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <!-- Status -->
        <div class="status" id="status">
            <span class="spinner" id="spinner"></span>
            <span id="statusText">🔌 Clique em "Iniciar" para ativar a câmera</span>
        </div>

        <!-- Área de correção manual (plus) -->
        <div class="manual-area">
            <input type="text" id="cardName" placeholder="✏️ Corrija o nome aqui se necessário" />
            <button id="searchManual">Buscar</button>
        </div>

        <!-- Resultado da carta -->
        <div class="result" id="result">
            <div class="card-name" id="cardNameDisplay">—</div>
            <div class="card-set" id="cardSetDisplay">—</div>
            <div class="card-detail" id="cardDetails"></div>
            <img class="card-image" id="cardImage" alt="Imagem da carta" />
        </div>

        <div class="footnote">
            Dados da <a href="https://scryfall.com" target="_blank">Scryfall</a> &bull; OCR via <a href="https://ocr.space" target="_blank">OCR.space</a> (gratuito)
        </div>
    </div>

    <script>
        // ================================================================
        //  SCANNER MTG – CÂMERA + OCR ONLINE (OCR.space)
        // ================================================================

        // ---- Elementos ----
        const video = document.getElementById('video');
        const startCam = document.getElementById('startCam');
        const stopCam = document.getElementById('stopCam');
        const scanBtn = document.getElementById('scanBtn');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const resultDiv = document.getElementById('result');
        const cardNameDisplay = document.getElementById('cardNameDisplay');
        const cardSetDisplay = document.getElementById('cardSetDisplay');
        const cardDetails = document.getElementById('cardDetails');
        const cardImage = document.getElementById('cardImage');
        const nameInput = document.getElementById('cardName');
        const searchManualBtn = document.getElementById('searchManual');

        let stream = null;
        let isProcessing = false;

        // ---- Atualizar status ----
        function setStatus(msg, loading = false) {
            statusText.textContent = msg;
            spinner.classList.toggle('active', loading);
        }

        // ---- Câmera ----
        async function startCamera() {
            try {
                setStatus('📷 Solicitando câmera...', true);
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 } }
                });
                video.srcObject = stream;
                await video.play();
                startCam.disabled = true;
                stopCam.disabled = false;
                scanBtn.disabled = false;
                setStatus('📷 Câmera ativa – enquadre o topo da carta');
            } catch (err) {
                setStatus('❌ Erro: ' + err.message);
                console.error(err);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            startCam.disabled = false;
            stopCam.disabled = true;
            scanBtn.disabled = true;
            setStatus('Câmera desligada');
        }

        // ---- Capturar frame ----
        function captureFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas;
        }

        // ---- Recortar área do NOME (topo central) e aplicar pré-processamento ----
        function cropAndPreprocess(canvas) {
            const w = canvas.width;
            const h = canvas.height;
            // Recorte: 60% da largura centralizado, 25% do topo
            const cropX = w * 0.20;
            const cropY = h * 0.04;
            const cropW = w * 0.60;
            const cropH = h * 0.22;

            const cropped = document.createElement('canvas');
            cropped.width = cropW;
            cropped.height = cropH;
            const ctx = cropped.getContext('2d');
            ctx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            // Aumenta contraste e binariza para melhorar OCR
            const imageData = ctx.getImageData(0, 0, cropW, cropH);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                const val = gray > 128 ? 255 : 0; // binarização simples
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
            }
            ctx.putImageData(imageData, 0, 0);

            return cropped;
        }

        // ---- Enviar imagem para OCR.space (API gratuita) ----
        async function ocrOnline(canvas) {
            // Converte canvas para base64
            const base64 = canvas.toDataURL('image/png').split(',')[1];

            const formData = new FormData();
            formData.append('base64Image', `data:image/png;base64,${base64}`);
            formData.append('apikey', 'K80807337088957'); // Chave gratuita pública do OCR.space (limitada)
            formData.append('language', 'eng');
            formData.append('scale', 'true');
            formData.append('OCREngine', '2'); // Engine mais moderna
            formData.append('isTable', 'false');
            formData.append('detectOrientation', 'true');

            const response = await fetch('https://api.ocr.space/parse/image', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error(`OCR.space erro ${response.status}`);
            }
            const data = await response.json();
            if (data.IsErroredOnProcessing) {
                throw new Error(data.ErrorMessage || 'Erro no OCR');
            }
            // Junta todo o texto reconhecido
            const parsedText = data.ParsedResults.map(r => r.ParsedText).join(' ');
            return parsedText.trim();
        }

        // ---- Extrair o nome da carta do texto do OCR ----
        function extractCardName(ocrText) {
            if (!ocrText) return null;
            // Remove linhas vazias e pega a primeira linha que pareça um nome de carta
            const lines = ocrText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            for (const line of lines) {
                // Ignora linhas com muitas palavras (tipo, texto da carta) - pega a primeira linha curta
                const words = line.split(/\s+/).length;
                if (words <= 6 && words >= 1) {
                    // Remove caracteres estranhos
                    const clean = line.replace(/[^a-zA-Z0-9\s'\-]/g, '');
                    if (clean.length >= 2) return clean;
                }
            }
            // Fallback: pega a primeira linha não vazia
            return lines[0] || null;
        }

        // ---- Buscar carta na Scryfall ----
        async function searchCard(name) {
            if (!name || name.trim().length < 2) return null;
            const trimmed = name.trim();
            const url =
                `https://api.scryfall.com/cards/search?q=!"${encodeURIComponent(trimmed)}"&unique=cards`;
            const resp = await fetch(url);
            if (!resp.ok) {
                if (resp.status === 404) return null;
                throw new Error(`Scryfall erro ${resp.status}`);
            }
            const data = await resp.json();
            return data.data && data.data.length > 0 ? data.data[0] : null;
        }

        // ---- Exibir resultado ----
        function showResult(card, searchedName) {
            resultDiv.classList.add('visible');
            if (!card) {
                cardNameDisplay.textContent = '❌ Carta não encontrada';
                cardSetDisplay.textContent = `"${searchedName || '—'}"`;
                cardDetails.innerHTML = '';
                cardImage.style.display = 'none';
                return;
            }
            cardNameDisplay.textContent = card.name;
            cardSetDisplay.textContent = `${card.set_name || '?'}  •  #${card.collector_number || '?'}`;
            const parts = [];
            if (card.rarity) parts.push(`⭐ ${card.rarity.charAt(0).toUpperCase() + card.rarity.slice(1)}`);
            if (card.mana_cost) parts.push(`💧 ${card.mana_cost}`);
            if (card.type_line) parts.push(`📜 ${card.type_line}`);
            if (card.power && card.toughness) parts.push(`⚔️ ${card.power}/${card.toughness}`);
            if (card.cmc !== undefined) parts.push(`🔢 CMC: ${card.cmc}`);
            cardDetails.innerHTML = parts.map(p => `<span>${p}</span>`).join('');
            if (card.image_uris?.normal) {
                cardImage.src = card.image_uris.normal;
                cardImage.style.display = 'block';
            } else if (card.card_faces?.[0]?.image_uris?.normal) {
                cardImage.src = card.card_faces[0].image_uris.normal;
                cardImage.style.display = 'block';
            } else {
                cardImage.style.display = 'none';
            }
        }

        // ---- Fluxo principal: escanear ----
        async function scanCard() {
            if (isProcessing) return;
            if (!video.srcObject) {
                setStatus('⚠️ Ligue a câmera primeiro.');
                return;
            }

            isProcessing = true;
            scanBtn.disabled = true;
            setStatus('📸 Capturando imagem...', true);

            try {
                // 1. Captura e pré-processa
                const fullCanvas = captureFrame();
                const processedCanvas = cropAndPreprocess(fullCanvas);

                // 2. OCR online
                setStatus('🔎 Enviando para OCR.space...', true);
                const ocrText = await ocrOnline(processedCanvas);
                console.log('OCR bruto:', ocrText);

                // 3. Extrai o nome
                const guessedName = extractCardName(ocrText);
                if (!guessedName) {
                    setStatus('❌ Não foi possível identificar o nome. Tente enquadrar melhor.');
                    showResult(null, '—');
                    // Preenche o campo manual com o texto bruto para o usuário corrigir
                    nameInput.value = ocrText.substring(0, 60);
                    return;
                }

                // 4. Preenche o campo manual e busca
                nameInput.value = guessedName;
                setStatus(`🔍 Nome lido: "${guessedName}" — buscando...`, true);

                const card = await searchCard(guessedName);
                if (card) {
                    setStatus(`✅ Encontrado: ${card.name}`);
                    showResult(card, guessedName);
                } else {
                    setStatus(`⚠️ Nenhuma carta com "${guessedName}" — tente corrigir o nome acima.`);
                    showResult(null, guessedName);
                }

            } catch (err) {
                setStatus('❌ Erro: ' + err.message);
                console.error(err);
            } finally {
                isProcessing = false;
                scanBtn.disabled = false;
            }
        }

        // ---- Busca manual (plus) ----
        async function manualSearch() {
            const name = nameInput.value.trim();
            if (!name) {
                setStatus('⚠️ Digite um nome.');
                return;
            }
            setStatus(`🔍 Buscando "${name}"...`, true);
            try {
                const card = await searchCard(name);
                if (card) {
                    setStatus(`✅ Encontrado: ${card.name}`);
                    showResult(card, name);
                } else {
                    setStatus(`❌ Nenhuma carta com "${name}"`);
                    showResult(null, name);
                }
            } catch (err) {
                setStatus('❌ Erro: ' + err.message);
                console.error(err);
            }
        }

        // ---- Upload de imagem (usando mesmo fluxo) ----
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            setStatus('📂 Processando imagem...', true);
            try {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const processed = cropAndPreprocess(canvas);
                    setStatus('🔎 Enviando para OCR.space...', true);
                    const ocrText = await ocrOnline(processed);
                    const guessed = extractCardName(ocrText);
                    if (guessed) {
                        nameInput.value = guessed;
                        setStatus(`📝 Nome lido: "${guessed}" — buscando...`, true);
                        const card = await searchCard(guessed);
                        if (card) {
                            setStatus(`✅ ${card.name}`);
                            showResult(card, guessed);
                        } else {
                            setStatus(`⚠️ Nenhuma carta com "${guessed}"`);
                            showResult(null, guessed);
                        }
                    } else {
                        setStatus('❌ Não foi possível ler o nome na imagem.');
                        nameInput.value = ocrText.substring(0, 60);
                        showResult(null, '—');
                    }
                };
                img.src = URL.createObjectURL(file);
            } catch (err) {
                setStatus('❌ Erro: ' + err.message);
            }
            fileInput.value = '';
        }

        // ---- Event listeners ----
        startCam.addEventListener('click', startCamera);
        stopCam.addEventListener('click', stopCamera);
        scanBtn.addEventListener('click', scanCard);
        fileInput.addEventListener('change', handleFileUpload);
        searchManualBtn.addEventListener('click', manualSearch);
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') manualSearch();
        });

        // ---- Inicialização ----
        setStatus('📷 Clique em "Iniciar" e aponte para o nome da carta');
        resultDiv.classList.remove('visible');
    </script>
</body>
</html>
