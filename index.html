<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanner de Cartas - Busca Automática</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        #app {
            max-width: 960px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 25px 30px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            color: #0f172a;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.6rem;
            font-weight: 400;
            color: #64748b;
            margin-left: auto;
        }
        .camera-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 15px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #canvas {
            display: none;
        }
        .camera-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .camera-controls button {
            padding: 10px 22px;
            border: none;
            border-radius: 30px;
            background: #e2e8f0;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .camera-controls button:hover {
            background: #cbd5e1;
        }
        .camera-controls button.primary {
            background: #2563eb;
            color: white;
        }
        .camera-controls button.primary:hover {
            background: #1d4ed8;
        }
        .camera-controls button.danger {
            background: #ef4444;
            color: white;
        }
        .camera-controls button.danger:hover {
            background: #dc2626;
        }
        .camera-controls button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        #ocrStatus {
            text-align: center;
            font-size: 0.9rem;
            color: #475569;
            min-height: 1.5rem;
            margin: 6px 0;
        }
        #ocrText {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 120px;
            overflow-y: auto;
            margin: 8px 0 0;
            color: #0f172a;
        }
        .manual-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .manual-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .manual-row .form-group {
            flex: 1 1 180px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .manual-row .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .manual-row .form-group input {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            transition: 0.2s;
            width: 100%;
        }
        .manual-row .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .manual-row .form-group.price-group {
            flex: 0 1 160px;
        }
        .btn-add {
            padding: 10px 28px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            height: 44px;
            align-self: flex-end;
        }
        .btn-add:hover {
            background: #16a34a;
        }
        .btn-add:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .list-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .list-header h3 {
            margin: 0;
            color: #1e293b;
        }
        .list-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .list-actions button {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            background: #e2e8f0;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .list-actions button:hover {
            background: #cbd5e1;
        }
        .list-actions button.copy {
            background: #2563eb;
            color: white;
        }
        .list-actions button.copy:hover {
            background: #1d4ed8;
        }
        #cardTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        #cardTable th {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 2px solid #e2e8f0;
            color: #475569;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        #cardTable td {
            padding: 10px 8px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        #cardTable tr:last-child td {
            border-bottom: none;
        }
        .qty-cell {
            font-weight: 600;
            text-align: center;
        }
        .price-cell {
            font-weight: 600;
            color: #0f172a;
        }
        .remove-btn {
            background: #fee2e2;
            border: none;
            color: #b91c1c;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .remove-btn:hover {
            background: #fecaca;
        }
        .empty-msg {
            color: #94a3b8;
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }
        #copyFeedback {
            font-size: 0.8rem;
            color: #16a34a;
            margin-left: 10px;
            opacity: 0;
            transition: 0.2s;
        }
        #copyFeedback.show {
            opacity: 1;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #e2e8f0;
            color: #475569;
        }
        .status-badge.success {
            background: #dcfce7;
            color: #166534;
        }
        .status-badge.error {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-badge.loading {
            background: #fef9c3;
            color: #854d0e;
        }
        @media (max-width: 600px) {
            #app {
                padding: 15px;
            }
            .manual-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-add {
                width: 100%;
                justify-content: center;
            }
            .list-header {
                flex-direction: column;
                align-items: stretch;
            }
            .list-actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>
            🃏 Scanner + Busca Automática
            <small>OCR → Nome → Preço</small>
        </h1>

        <!-- CÂMERA E OCR -->
        <div class="camera-section">
            <div class="video-wrapper">
                <video id="video" autoplay playsinline></video>
            </div>
            <div class="camera-controls">
                <button id="startCameraBtn" class="primary">📸 Abrir Câmera</button>
                <button id="scanBtn" class="primary" disabled>🔍 Escanear e Adicionar</button>
                <button id="stopCameraBtn" class="danger" disabled>⏹️ Fechar</button>
            </div>
            <div id="ocrStatus">Aguardando ação...</div>
            <div id="ocrText"></div>
        </div>

        <!-- ÁREA MANUAL (opcional) -->
        <div class="manual-section">
            <div class="manual-row">
                <div class="form-group">
                    <label for="cardName">Nome da carta</label>
                    <input type="text" id="cardName" placeholder="Ex: Black Lotus" />
                </div>
                <div class="form-group" style="flex: 0 1 100px;">
                    <label for="cardQty">Qtd</label>
                    <input type="number" id="cardQty" value="1" min="1" step="1" />
                </div>
                <div class="form-group price-group">
                    <label for="cardPrice">Preço (R$)</label>
                    <input type="number" id="cardPrice" step="0.01" placeholder="Busca automática" />
                </div>
                <button id="addBtn" class="btn-add">➕ Adicionar manual</button>
            </div>
            <div id="searchStatus" style="margin-top: 10px; font-size:0.9rem; color:#475569;"></div>
        </div>

        <!-- LISTA -->
        <div class="list-section">
            <div class="list-header">
                <h3>📋 Lista de Cartas</h3>
                <div class="list-actions">
                    <button id="copyBtn" class="copy">📄 Copiar Lista</button>
                    <button id="clearBtn">🗑️ Limpar</button>
                    <span id="copyFeedback">Copiado!</span>
                </div>
            </div>
            <table id="cardTable">
                <thead>
                    <tr><th>Qtd</th><th>Nome</th><th>Preço (R$)</th><th style="width:60px;"></th></tr>
                </thead>
                <tbody id="cardBody">
                    <tr><td colspan="4" class="empty-msg">Nenhuma carta adicionada.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // Elementos
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            const ocrText = document.getElementById('ocrText');
            const ocrStatus = document.getElementById('ocrStatus');
            const searchStatus = document.getElementById('searchStatus');

            const startBtn = document.getElementById('startCameraBtn');
            const scanBtn = document.getElementById('scanBtn');
            const stopBtn = document.getElementById('stopCameraBtn');

            const cardName = document.getElementById('cardName');
            const cardQty = document.getElementById('cardQty');
            const cardPrice = document.getElementById('cardPrice');
            const addBtn = document.getElementById('addBtn');

            const cardBody = document.getElementById('cardBody');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            const copyFeedback = document.getElementById('copyFeedback');

            let stream = null;
            let isCameraReady = false;

            // Lista de cartas
            let cards = [];

            // Taxa de câmbio (cache)
            let exchangeRate = null;
            let exchangeRateTimestamp = 0;

            // ========== CÂMERA ==========
            async function startCamera() {
                try {
                    if (stream) stopCamera();
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    isCameraReady = true;
                    startBtn.disabled = true;
                    scanBtn.disabled = false;
                    stopBtn.disabled = false;
                    ocrStatus.textContent = '✅ Câmera ativa. Aponte para a carta e clique em "Escanear e Adicionar".';
                    ocrText.textContent = '';
                } catch (err) {
                    console.error(err);
                    ocrStatus.textContent = '❌ Erro ao acessar a câmera: ' + err.message;
                }
            }

            function stopCamera() {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                video.srcObject = null;
                isCameraReady = false;
                startBtn.disabled = false;
                scanBtn.disabled = true;
                stopBtn.disabled = true;
                ocrStatus.textContent = '⏸️ Câmera fechada.';
            }

            // ========== EXTRAÇÃO DE NOME (ignorando números/preços) ==========
            function extractCardName(ocrText) {
                const lines = ocrText.split('\n')
                    .map(l => l.trim())
                    .filter(l => l.length > 0);

                // Filtra linhas que contêm apenas números, símbolos monetários ou pontuação
                const isNumberOrPrice = (line) => {
                    // Remove espaços e verifica se é basicamente números, vírgulas, pontos, R$, $, etc.
                    const clean = line.replace(/[\s,.]/g, '');
                    if (/^[\d]+$/.test(clean)) return true; // só números
                    if (/^R?\$?[\d]+$/.test(clean)) return true; // preço sem centavos
                    // Se tiver mais números que letras, considera como preço
                    const digits = (line.match(/\d/g) || []).length;
                    const letters = (line.match(/[a-zA-Z]/g) || []).length;
                    if (digits > letters && digits > 3) return true;
                    return false;
                };

                // Pega a primeira linha que não seja número/preço e tenha pelo menos 3 letras
                for (const line of lines) {
                    if (isNumberOrPrice(line)) continue;
                    // Deve ter pelo menos 2 caracteres alfabéticos
                    const letterCount = (line.match(/[a-zA-Z]/g) || []).length;
                    if (letterCount >= 2) {
                        return line;
                    }
                }

                // Fallback: primeira linha que não seja vazia
                for (const line of lines) {
                    if (!isNumberOrPrice(line) && line.length > 1) {
                        return line;
                    }
                }

                return null;
            }

            // ========== OCR + BUSCA + ADIÇÃO AUTOMÁTICA ==========
            async function scanAndAdd() {
                if (!isCameraReady || !stream) {
                    ocrStatus.textContent = '⚠️ Ative a câmera primeiro.';
                    return;
                }

                // 1. Capturar imagem
                const vw = video.videoWidth || 640;
                const vh = video.videoHeight || 480;
                canvas.width = vw;
                canvas.height = vh;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, vw, vh);

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
                if (!blob) {
                    ocrStatus.textContent = '❌ Falha ao capturar imagem.';
                    return;
                }

                // 2. OCR
                ocrStatus.textContent = '⏳ Reconhecendo texto...';
                scanBtn.disabled = true;
                let recognizedText = '';

                try {
                    const result = await Tesseract.recognize(blob, 'por', {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                ocrStatus.textContent = `⏳ OCR: ${Math.round(m.progress * 100)}%`;
                            }
                        }
                    });
                    recognizedText = result.data.text;
                    ocrText.textContent = recognizedText || '(nenhum texto encontrado)';
                    ocrStatus.textContent = '✅ OCR concluído. Extraindo nome...';
                } catch (err) {
                    console.error(err);
                    ocrStatus.textContent = '❌ Erro no OCR: ' + err.message;
                    scanBtn.disabled = false;
                    return;
                }

                // 3. Extrair nome (ignorando números/preços)
                const extractedName = extractCardName(recognizedText);
                if (!extractedName) {
                    ocrStatus.textContent = '⚠️ Nenhum nome válido identificado. Tente novamente ou adicione manualmente.';
                    scanBtn.disabled = false;
                    return;
                }

                // Atualiza o campo nome
                cardName.value = extractedName;

                // 4. Buscar preço na Scryfall
                searchStatus.textContent = `⏳ Buscando "${extractedName}" na Scryfall...`;
                const result = await searchCardPrice(extractedName);

                let priceBRL = 0;
                let officialName = extractedName;

                if (result && result.priceBRL !== null) {
                    priceBRL = result.priceBRL;
                    officialName = result.name || extractedName;
                    cardName.value = officialName;
                    cardPrice.value = priceBRL.toFixed(2);
                    searchStatus.textContent = `✅ Encontrado: ${officialName} - R$ ${priceBRL.toFixed(2)}`;
                } else if (result && result.priceBRL === null) {
                    officialName = result.name || extractedName;
                    cardName.value = officialName;
                    cardPrice.value = '';
                    searchStatus.textContent = `⚠️ Carta "${officialName}" encontrada, mas sem preço disponível.`;
                    priceBRL = 0;
                } else {
                    searchStatus.textContent = `❌ Não foi possível encontrar "${extractedName}". Adicionando sem preço.`;
                    priceBRL = 0;
                }

                // 5. Adicionar à lista
                const qty = parseInt(cardQty.value) || 1;
                addCardToList(officialName, qty, priceBRL);

                // 6. Limpar campos para próxima (mantém nome e preço, zera quantidade)
                cardQty.value = 1;
                ocrStatus.textContent = '✅ Carta adicionada! Pronto para escanear outra.';
                scanBtn.disabled = false;
            }

            // ========== BUSCA NA SCRYFALL ==========
            async function fetchExchangeRate() {
                const now = Date.now();
                if (exchangeRate && (now - exchangeRateTimestamp) < 3600000) {
                    return exchangeRate;
                }
                try {
                    const resp = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                    if (!resp.ok) throw new Error('Erro ao obter cotação');
                    const data = await resp.json();
                    const rate = data.rates.BRL;
                    if (!rate) throw new Error('Moeda BRL não encontrada');
                    exchangeRate = rate;
                    exchangeRateTimestamp = now;
                    return rate;
                } catch (err) {
                    console.warn('Erro ao buscar cotação, usando taxa fixa 5.00', err);
                    return 5.00;
                }
            }

            async function searchCardPrice(cardNameStr) {
                if (!cardNameStr.trim()) return null;
                try {
                    const url = `https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(cardNameStr.trim())}`;
                    const resp = await fetch(url);
                    if (!resp.ok) {
                        if (resp.status === 404) return null;
                        throw new Error(`HTTP ${resp.status}`);
                    }
                    const data = await resp.json();

                    let priceUSD = data.prices?.usd || data.prices?.eur || data.prices?.tix || null;
                    if (!priceUSD) {
                        return { name: data.name, priceBRL: null, set: data.set_name };
                    }
                    const rate = await fetchExchangeRate();
                    const priceBRL = parseFloat(priceUSD) * rate;
                    return {
                        name: data.name,
                        priceUSD: parseFloat(priceUSD),
                        set: data.set_name,
                        priceBRL: priceBRL
                    };
                } catch (err) {
                    console.error(err);
                    return null;
                }
            }

            // ========== MANIPULAÇÃO DA LISTA ==========
            function addCardToList(name, qty, price) {
                if (!name.trim()) {
                    alert('Nome inválido.');
                    return false;
                }
                const qtyNum = parseInt(qty) || 1;
                const priceNum = parseFloat(price) || 0;
                cards.push({
                    name: name.trim(),
                    qty: qtyNum,
                    price: priceNum
                });
                renderList();
                return true;
            }

            function removeCard(index) {
                cards.splice(index, 1);
                renderList();
            }

            function clearList() {
                if (cards.length === 0) return;
                if (confirm('Limpar toda a lista?')) {
                    cards = [];
                    renderList();
                }
            }

            function renderList() {
                if (cards.length === 0) {
                    cardBody.innerHTML = `<tr><td colspan="4" class="empty-msg">Nenhuma carta adicionada.</td></tr>`;
                    return;
                }
                let html = '';
                cards.forEach((card, index) => {
                    const priceStr = card.price ? card.price.toFixed(2).replace('.', ',') : '—';
                    html += `
                        <tr>
                            <td class="qty-cell">${card.qty}</td>
                            <td><strong>${escapeHtml(card.name)}</strong></td>
                            <td class="price-cell">R$ ${priceStr}</td>
                            <td><button class="remove-btn" data-index="${index}" title="Remover">✕</button></td>
                        </tr>
                    `;
                });
                cardBody.innerHTML = html;
                document.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        removeCard(parseInt(this.dataset.index));
                    });
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ========== COPIAR ==========
            function copyList() {
                if (cards.length === 0) {
                    alert('Lista vazia.');
                    return;
                }
                const lines = cards.map(c => {
                    const priceStr = c.price ? c.price.toFixed(2).replace('.', ',') : '—';
                    return `${c.qty}x ${c.name} - R$ ${priceStr}`;
                });
                const text = lines.join('\n');
                navigator.clipboard.writeText(text).then(() => {
                    copyFeedback.classList.add('show');
                    setTimeout(() => copyFeedback.classList.remove('show'), 2500);
                }).catch(() => alert('Erro ao copiar.'));
            }

            // ========== EVENTOS ==========
            startBtn.addEventListener('click', startCamera);
            stopBtn.addEventListener('click', stopCamera);
            scanBtn.addEventListener('click', scanAndAdd);

            addBtn.addEventListener('click', function() {
                const name = cardName.value.trim();
                const qty = parseInt(cardQty.value) || 1;
                const price = parseFloat(cardPrice.value.replace(',', '.')) || 0;
                if (!name) { alert('Digite o nome.'); return; }
                addCardToList(name, qty, price);
                cardQty.value = 1;
                cardName.focus();
                cardName.select();
            });

            // Enter nos campos
            cardName.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                    scanBtn.click(); } });
            cardPrice.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                    addBtn.click(); } });
            cardQty.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                    scanBtn.click(); } });

            copyBtn.addEventListener('click', copyList);
            clearBtn.addEventListener('click', clearList);

            // ========== INICIALIZAÇÃO ==========
            renderList();
            ocrStatus.textContent = '📸 Abra a câmera e escaneie cartas automaticamente.';
            searchStatus.textContent = 'O sistema extrai apenas o nome e busca o preço online.';

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                startBtn.disabled = true;
                ocrStatus.textContent = '❌ Câmera não suportada.';
            }

            // Pré-carrega cotação
            fetchExchangeRate().catch(() => {});
        })();
    </script>
</body>
